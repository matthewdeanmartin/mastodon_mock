<div class="rss-article">
  <app-reader-core
    [chain]="chain()"
    [routeId]="status().id"
    layout="pane"
    (shareQuote)="shareSelection($event)"
  />

  <!-- Offered after the article, where someone has actually read the thing.
       Highlight a passage first and it travels as a quote. -->
  <p class="share-line">
    <button class="btn btn-sm" type="button" (click)="openShare()">
      {{ 'pages.rss.article.share' | transloco }}
    </button>
    <span class="muted small">{{ 'pages.rss.article.highlightFirst' | transloco }}</span>
  </p>
</div>

@if (showShare()) {
  <app-share-dialog
    [status]="status()"
    [quote]="shareQuote()"
    (compose)="composeShare($event)"
    (closed)="showShare.set(false)"
  />
}
