<main class="oauth-wrap">
  <section class="oauth-card" aria-live="polite">
    <span class="oauth-badge" aria-hidden="true">🦋</span>
    @if (error(); as message) {
      <h1>Bluesky sign-in did not finish</h1>
      <p class="oauth-error" role="alert">{{ message }}</p>
      <a class="oauth-button" routerLink="/login/bluesky">Back to Bluesky sign-in</a>
    } @else {
      <h1>Finishing Bluesky sign-in…</h1>
      <p>Your PDS is exchanging the one-time authorization code.</p>
    }
  </section>
</main>
