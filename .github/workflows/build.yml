---
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build admin UI
        run: make ui
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Run quality gates
        run: uv run make check-ci

  # The UI's own gates.
  #
  # Separate from `quality-gates` above, which runs `make check-ci` — that is the
  # *Python* Makefile, and it never touched the UI check scripts. The result was
  # that `check:storage`, `check:terminology` and friends existed, were referred
  # to in comments as "wired into make check", and in fact ran nowhere: they
  # could only be invoked by hand, so nobody did, and they drifted.
  #
  # The deploy workflow (mockingbird-pages.yml) still builds and publishes with
  # no gate of its own. This job is what stops a broken change reaching main; it
  # deliberately does not slow the deploy path down.
  ui-gates:
    name: UI gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci

      # Cheap and substantive, so they run first and fail before anything expensive.
      - name: Static checks
        run: npm run check:storage && npm run check:subpaths && npm run starter-kits:check

      # Formatting is useful feedback, but it must not block a substantive change.
      - name: Formatting (reported, not enforced)
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:ci

      # ## Why these two are allowed to fail
      #
      # Both were already failing before this job existed: `check:terminology` on
      # reader-vocabulary wording, `test:source-integrity` on one vacuous
      # assertion. Neither is new, and turning them red on arrival would train
      # everyone to ignore a red build — worse than the drift they catch.
      #
      # They move up into the enforcing steps above as each backlog is cleared.
      # `check:storage` already did: its 15 findings were resolved (12 keys
      # classified, 2 stale entries replaced by their successor, 1 false positive
      # fixed in the script), so it is enforced in the static checks above.
      - name: Known-failing checks (reported, not enforced)
        continue-on-error: true
        run: npm run check:known-failing
