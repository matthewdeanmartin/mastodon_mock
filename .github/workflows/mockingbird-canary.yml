---
name: Deploy Mawkingbird Canary and Test
# Publish every main-branch commit to the /canary/ and /test/ subpaths of this
# repo's own GitHub Pages site.
#
# The published site lives on the gh-pages branch of THIS repository:
#   /         -> production (updated manually by mockingbird-pages.yml)
#   /canary/  -> canary     (updated by this workflow on every commit)
#   /test/    -> test       (updated by this workflow on every commit)
#
# Canary and production are the SAME environment: canary is the preview of
# upcoming features for real customers, on live billing. /test/ is the odd one
# out — it points at the sandbox CORS Worker, where Stripe is in test mode, and
# its accounts are limited to an explicit tester list held in that Worker's KV.
# Nothing bought at /test/ is real.
# The same commit is also published to the mirror repository at:
#   https://matthewdeanmartin.github.io/mawkingbird/canary/
#
# Each workflow updates only its own subtree of gh-pages, so canary deploys
# never disturb production and vice versa. No cross-repo PAT is needed: the
# built-in GITHUB_TOKEN can push to this repo.
on:
  push:
    branches: [main]

# Serialize gh-pages writers so canary and prod never race on the branch.
concurrency:
  group: gh-pages-branch
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Stamp build info
        run: node ui/scripts/gen-build-info.mjs
      - name: Build Canary
        # Served from the /canary/ sub-path, so build with a matching base href.
        run: make mockingbird MOCKINGBIRD_BASE_HREF=/canary/
      - name: Add canary marker
        # No per-directory 404.html here: GitHub Pages serves only the site-root
        # /404.html (published by production), which is subpath-aware and routes
        # /canary/… deep links back into this canary SPA. A /canary/404.html
        # would just be dead weight — Pages never serves it.
        run: printf '%s\n' "$GITHUB_SHA" > ui/dist-mockingbird/browser/canary-commit.txt
      - name: Publish /canary/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-gh-pages.sh canary ui/dist-mockingbird/browser

  test-deployment:
    name: Build and deploy /test/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # Serialized behind canary because both push to gh-pages. GitHub's
    # `concurrency:` group serializes whole workflow RUNS, not jobs, so two jobs
    # in THIS run are outside that lock and would race — the loser's push being
    # rejected with "fetch first". The publish script retries from a fresh clone
    # and would recover on its own, but a retry costs a rebuild-length wait, and
    # not racing is cheaper than losing gracefully.
    needs: deploy
    # Deliberately a job in THIS workflow rather than a file of its own. /test/
    # and /canary/ are meant to be the same commit, and sharing the trigger
    # makes that structural instead of coincidental — two workflows on the same
    # `on:` would drift the moment one of them failed or was disabled.
    #
    # Also deliberately NOT mirrored to github.io. The mirror exists as a
    # fallback for production if the custom domain breaks; a second copy of the
    # test build would be extra public surface serving no purpose.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Stamp build info
        run: node ui/scripts/gen-build-info.mjs
      - name: Build /test/
        # The base href is the whole configuration. `isTestBuild()` reads it at
        # runtime to pick the sandbox CORS Worker, and boot.js reads it to paint
        # the grey background before first frame — so there is no separate
        # Angular build configuration to keep in step, and no way to produce a
        # bundle that disagrees with itself about which deployment it is.
        run: make mockingbird MOCKINGBIRD_BASE_HREF=/test/
      - name: Add test marker
        run: printf '%s\n' "$GITHUB_SHA" > ui/dist-mockingbird/browser/test-commit.txt
      - name: Verify this really is a test build
        # Cheap insurance against the one failure that matters: a build that
        # looks like production, talks to live Stripe, and is served at /test/
        # where nobody expects real money to move.
        run: |
          grep --fixed-strings '<base href="/test/"/>' ui/dist-mockingbird/browser/index.html
          test ! -e ui/dist-mockingbird/browser/CNAME
      - name: Publish /test/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-gh-pages.sh test ui/dist-mockingbird/browser

  mirror:
    name: Build and deploy github.io Canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MIRROR_BASE_HREF: /mawkingbird/canary/
      MIRROR_REPOSITORY: matthewdeanmartin/mawkingbird
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Configure mirror deploy key
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MAWKINGBIRD_DEPLOY_KEY }}
        run: |
          test -n "$MIRROR_DEPLOY_KEY"
          key="$RUNNER_TEMP/mawkingbird-deploy-key"
          known_hosts="$RUNNER_TEMP/github-known-hosts"
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          curl --fail --silent --show-error https://api.github.com/meta \
            | jq --raw-output '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts" \
            >> "$GITHUB_ENV"
      - name: Stamp build info
        run: node ui/scripts/gen-build-info.mjs
      - name: Build github.io Canary
        run: make mockingbird MOCKINGBIRD_BASE_HREF="$MIRROR_BASE_HREF"
      - name: Add canary marker
        run: printf '%s\n' "$GITHUB_SHA" > ui/dist-mockingbird/browser/canary-commit.txt
      - name: Verify mirror Canary layout
        run: |
          grep --fixed-strings '<base href="/mawkingbird/canary/"/>' ui/dist-mockingbird/browser/index.html
          test ! -e ui/dist-mockingbird/browser/CNAME
      - name: Publish github.io /canary/
        env:
          PUBLISH_PUBLIC_BASE: /mawkingbird/canary/
          PUBLISH_REMOTE: git@github.com:${{ env.MIRROR_REPOSITORY }}.git
        run: bash .github/scripts/publish-gh-pages.sh canary ui/dist-mockingbird/browser
